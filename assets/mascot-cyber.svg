<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cyberShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Radar Circles -->
  <circle cx="260" cy="220" r="180" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2"/>
  <circle cx="260" cy="220" r="130" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.15"/>
  <circle cx="260" cy="220" r="70" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.25"/>

  <!-- Radar sweep line -->
  <line x1="260" y1="220" x2="380" y2="140" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>

  <!-- Ground Tech Ring -->
  <ellipse cx="260" cy="410" rx="160" ry="24" fill="#E0F2FE" opacity="0.6"/>
  <ellipse cx="260" cy="410" rx="120" ry="16" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.3"/>

  <!-- Holographic Floating Security Shield (Projected by character) -->
  <g transform="translate(60, 100)" filter="url(#cyberGlow)">
    <!-- Big Cyber Shield -->
    <path d="M70 20 L130 50 V110 C130 160 70 200 70 200 C70 200 10 160 10 110 V50 Z" fill="url(#cyberShieldGrad)" opacity="0.9"/>
    <path d="M70 35 L118 60 V108 C118 148 70 182 70 182 C70 182 22 148 22 108 V60 Z" fill="#0F172A" opacity="0.8"/>
    <!-- Padlock inside shield -->
    <rect x="52" y="100" width="36" height="30" rx="6" fill="#38BDF8"/>
    <path d="M58 100 V85 C58 78 63 74 70 74 C77 74 82 78 82 85 V100" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="70" cy="112" r="3.5" fill="#0F172A"/>
    <path d="M70 115 V122" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- Shield Status Pill -->
    <rect x="25" y="215" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#BAE6FD"/>
    <circle cx="38" cy="228" r="4" fill="#10B981"/>
    <text x="48" y="232" font-family="Tajawal, sans-serif" font-size="10" font-weight="800" fill="#0369A1">نظام آمن 100%</text>
  </g>

  <!-- The Cyber Security Specialist Mascot -->
  <!-- Legs -->
  <path d="M290 330 L280 415 L260 418 L260 424 L295 424 L303 340 Z" fill="#1E293B"/>
  <path d="M322 330 L332 415 L350 418 L350 424 L315 424 L308 340 Z" fill="#0F172A"/>

  <!-- Torso (Navy Tech Jacket with Cyan Security Accents) -->
  <path d="M280 205 L345 205 L355 335 L270 335 Z" fill="#1E293B"/>
  <!-- Security Vest / Collar -->
  <path d="M295 205 L312 250 L330 205 Z" fill="#0284C7"/>
  <rect x="282" y="240" width="12" height="6" rx="2" fill="#38BDF8"/>
  <circle cx="312" cy="270" r="3" fill="#38BDF8"/>
  <circle cx="312" cy="295" r="3" fill="#38BDF8"/>

  <!-- Right Arm (Operating holographic tablet) -->
  <path d="M345 210 L375 255 L355 285 L340 280 L355 255 L335 220 Z" fill="#334155"/>
  <!-- Holographic Tablet -->
  <rect x="330" y="275" width="45" height="32" rx="4" fill="#0369A1" opacity="0.8" transform="rotate(-10 330 275)"/>
  <line x1="335" y1="285" x2="365" y2="285" stroke="#38BDF8" stroke-width="2" transform="rotate(-10 330 275)"/>
  <line x1="335" y1="293" x2="355" y2="293" stroke="#38BDF8" stroke-width="2" transform="rotate(-10 330 275)"/>

  <!-- Left Arm (Pointing to the holographic shield) -->
  <path d="M280 210 L220 220 L200 170 L212 165 L228 205 L270 200 Z" fill="#334155"/>
  <path d="M200 170 L195 150 C195 145 202 145 204 150 L205 168 Z" fill="#FDE68A"/>

  <!-- Head with Cyber Headset -->
  <rect x="302" y="188" width="20" height="20" rx="4" fill="#FDE68A"/>
  <path d="M285 140 C285 105 340 105 340 140 C340 175 320 195 312 195 C304 195 285 175 285 140 Z" fill="#FEF08A"/>
  <!-- Hair -->
  <path d="M280 140 C278 105 300 85 330 85 C350 85 358 105 355 120 C348 116 340 115 335 118 C322 125 310 120 295 135 Z" fill="#0F172A"/>
  <!-- Cyber Headset -->
  <path d="M305 105 C320 100 338 105 346 120" fill="none" stroke="#0284C7" stroke-width="4"/>
  <rect x="340" y="125" width="10" height="18" rx="4" fill="#0284C7"/>
  <line x1="345" y1="140" x2="330" y2="155" stroke="#0284C7" stroke-width="2"/>
  <circle cx="328" cy="157" r="3" fill="#38BDF8"/>

  <!-- Face details -->
  <circle cx="304" cy="144" r="3.5" fill="#0F172A"/>
  <path d="M298 158 Q305 164 312 158" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Cyber Indicators (Right & Top) -->
  <g transform="translate(370, 70)" filter="url(#cyberGlow)">
    <rect width="135" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="22" cy="21" r="10" fill="#E0F2FE"/>
    <path d="M18 21 L21 24 L27 18" fill="none" stroke="#0284C7" stroke-width="2"/>
    <text x="38" y="25" font-family="Tajawal, sans-serif" font-size="11" font-weight="800" fill="#0F172A">فحص وحماية معتمدة</text>
  </g>

  <g transform="translate(375, 130)" filter="url(#cyberGlow)">
    <rect width="130" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="22" cy="21" r="10" fill="#FEF2F2"/>
    <path d="M22 16 V22 M22 26 V27" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="25" font-family="Tajawal, sans-serif" font-size="11" font-weight="800" fill="#0F172A">اكتشاف الثغرات 0-Day</text>
  </g>
</svg>
