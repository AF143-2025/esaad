<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6FC4"/>
      <stop offset="100%" stop-color="#0E4885"/>
    </linearGradient>
    <linearGradient id="heroRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#D42B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <radialGradient id="glowCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A6FC4" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#D42B2B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A6FC4" flood-opacity="0.15"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Circular Rings -->
  <circle cx="260" cy="230" r="190" fill="url(#glowCircle)"/>
  <circle cx="260" cy="230" r="160" fill="none" stroke="#1A6FC4" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>
  <circle cx="260" cy="230" r="210" fill="none" stroke="#D42B2B" stroke-width="1" stroke-dasharray="12 12" opacity="0.15"/>

  <!-- Tech Ground Platform / Disc -->
  <ellipse cx="260" cy="400" rx="180" ry="26" fill="#F0F4FA"/>
  <ellipse cx="260" cy="400" rx="140" ry="18" fill="none" stroke="#1A6FC4" stroke-width="2" opacity="0.3"/>
  <ellipse cx="260" cy="400" rx="90" ry="10" fill="none" stroke="#D42B2B" stroke-width="2" opacity="0.4"/>

  <!-- Floating Hologram Brand Card (Left) -->
  <g transform="translate(60, 110)" filter="url(#badgeShadow)">
    <rect width="130" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="4" rx="2" fill="url(#heroRedGrad)"/>
    <!-- Small AD Logo -->
    <path d="M22 62 L36 26 L44 26 L58 62 L50 62 L46 52 L34 52 L30 62 Z M36 45 L44 45 L40 33 Z" fill="#1A6FC4"/>
    <path d="M48 26 L48 62 L62 62 C74 62 82 54 82 44 C82 34 74 26 62 26 Z M56 33 L62 33 C69 33 74 38 74 44 C74 50 69 55 62 55 L56 55 Z" fill="#D42B2B"/>
    <text x="96" y="44" font-family="Tajawal, sans-serif" font-size="12" font-weight="800" fill="#111118">اصعد</text>
    <text x="96" y="58" font-family="Tajawal, sans-serif" font-size="10" font-weight="700" fill="#1A6FC4">GO uptm</text>
    <!-- Live status dot -->
    <circle cx="20" cy="18" r="4" fill="#22C55E"/>
    <text x="30" y="21" font-family="Tajawal, sans-serif" font-size="9" font-weight="600" fill="#64748B">منصة نشطة 100%</text>
  </g>

  <!-- The Tech Specialist Mascot (Center-Right) -->
  <!-- Shadow under character -->
  <ellipse cx="300" cy="402" rx="46" ry="10" fill="#CBD5E1" opacity="0.6"/>

  <!-- Legs -->
  <path d="M285 320 L275 395 L260 398 L260 405 L288 405 L295 330 Z" fill="#1E293B"/>
  <path d="M312 320 L322 395 L340 398 L340 405 L310 405 L303 330 Z" fill="#0F172A"/>

  <!-- Body / Torso (Modern Tech Polo Shirt) -->
  <path d="M272 205 L328 205 L336 325 L264 325 Z" fill="#64748B"/>
  <!-- Shirt Details -->
  <path d="M285 205 L300 240 L315 205 Z" fill="#334155"/>
  <circle cx="300" cy="256" r="3" fill="#E2E8F0"/>
  <circle cx="300" cy="275" r="3" fill="#E2E8F0"/>
  <circle cx="300" cy="295" r="3" fill="#E2E8F0"/>
  <!-- Pocket / Pen -->
  <rect x="276" y="235" width="14" height="18" rx="3" fill="#475569"/>
  <rect x="281" y="228" width="4" height="10" rx="1" fill="#D42B2B"/>

  <!-- Left Arm (Resting / Tech Watch) -->
  <path d="M272 210 L250 265 L260 295 L272 290 L264 265 L280 220 Z" fill="#475569"/>
  <!-- Left Hand holding tablet/phone -->
  <rect x="250" y="290" width="22" height="34" rx="4" fill="#0F172A" transform="rotate(-15 250 290)"/>
  <rect x="253" y="293" width="16" height="28" rx="2" fill="#1A6FC4" transform="rotate(-15 250 290)" opacity="0.8"/>

  <!-- Right Arm (Pointing UP to the stars / services) -->
  <!-- Upper arm -->
  <path d="M328 210 L365 200 L378 214 L336 230 Z" fill="#475569"/>
  <!-- Forearm pointing upwards -->
  <path d="M365 200 L395 130 L410 138 L378 214 Z" fill="#64748B"/>
  <!-- Hand with pointing index finger -->
  <path d="M395 130 L398 96 C398 92 404 92 404 96 L404 125 L408 127 C412 127 414 132 411 135 L404 140 Z" fill="#FDE68A"/>

  <!-- Head & Neck -->
  <rect x="290" y="188" width="20" height="22" rx="4" fill="#FDE68A"/>
  <!-- Head shape -->
  <path d="M275 140 C275 105 325 105 325 140 C325 175 305 195 300 195 C295 195 275 175 275 140 Z" fill="#FEF08A"/>
  <!-- Stylish Modern Hair -->
  <path d="M270 140 C268 110 285 90 315 88 C335 88 340 105 338 120 C332 118 325 116 320 120 C310 125 300 120 288 135 C282 142 274 146 270 140 Z" fill="#1E293B"/>
  <!-- Face features (minimalist modern vector) -->
  <circle cx="316" cy="142" r="3.5" fill="#1E293B"/>
  <path d="M312 156 Q318 162 324 156" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="318" cy="148" r="4" fill="#F87171" opacity="0.3"/>

  <!-- Floating Achievement Badges pointing to company strengths -->
  <!-- Badge 1: Top Right (Social & Growth) -->
  <g transform="translate(380, 50)" filter="url(#badgeShadow)">
    <rect width="130" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="19" cy="19" r="13" fill="#D42B2B"/>
    <!-- Rocket / Growth Icon -->
    <path d="M15 23 L18 19 L23 15 L21 21 L17 23 Z" fill="#FFFFFF"/>
    <text x="38" y="24" font-family="Tajawal, sans-serif" font-size="12" font-weight="700" fill="#111118">تصعيد حسابات 🚀</text>
  </g>

  <!-- Badge 2: Mid Right (Cyber Security) -->
  <g transform="translate(370, 260)" filter="url(#badgeShadow)">
    <rect width="134" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="19" cy="19" r="13" fill="#1A6FC4"/>
    <!-- Shield Icon -->
    <path d="M19 12 L25 15 V19 C25 23 19 26 19 26 C19 26 13 23 13 19 V15 Z" fill="#FFFFFF"/>
    <text x="38" y="24" font-family="Tajawal, sans-serif" font-size="12" font-weight="700" fill="#111118">حماية أمنية 100% 🛡️</text>
  </g>

  <!-- Badge 3: Bottom Left (Programming) -->
  <g transform="translate(70, 310)" filter="url(#badgeShadow)">
    <rect width="134" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="19" cy="19" r="13" fill="#0F172A"/>
    <!-- Code Brackets -->
    <text x="13" y="24" font-family="monospace" font-size="14" font-weight="900" fill="#38BDF8">&lt;/&gt;</text>
    <text x="38" y="24" font-family="Tajawal, sans-serif" font-size="12" font-weight="700" fill="#111118">برمجة وتطوير 💻</text>
  </g>

  <!-- Floating Social Media Floating Bubbles (Connecting to flyer theme) -->
  <!-- Instagram Bubble -->
  <g transform="translate(190, 60)" filter="url(#badgeShadow)">
    <circle cx="20" cy="20" r="20" fill="url(#heroRedGrad)"/>
    <rect x="11" y="11" width="18" height="18" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="20" cy="20" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="25" cy="15" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Telegram / Blue Bubble -->
  <g transform="translate(245, 30)" filter="url(#badgeShadow)">
    <circle cx="18" cy="18" r="18" fill="#229ED9"/>
    <path d="M12 18 L24 13 L20 23 L16 20 Z" fill="#FFFFFF"/>
  </g>

  <!-- Facebook Bubble -->
  <g transform="translate(325, 35)" filter="url(#badgeShadow)">
    <circle cx="18" cy="18" r="18" fill="#1877F2"/>
    <path d="M21 15 H19 V13 C19 12.5 19.5 12 20 12 H21 V9 H19 C17 9 16 10.5 16 12.5 V15 H14 V18 H16 V27 H19 V18 H21 Z" fill="#FFFFFF"/>
  </g>

  <!-- Sparkles -->
  <path d="M220 170 L223 160 L226 170 L236 173 L226 176 L223 186 L220 176 L210 173 Z" fill="#F59E0B" opacity="0.8"/>
  <path d="M370 110 L372 103 L374 110 L381 112 L374 114 L372 121 L370 114 L363 112 Z" fill="#3B82F6" opacity="0.7"/>
</svg>
