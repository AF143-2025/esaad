<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" height="100%">
  <defs>
    <linearGradient id="devBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6FC4"/>
      <stop offset="100%" stop-color="#0E4885"/>
    </linearGradient>
    <linearGradient id="codeDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="devShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A6FC4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Light Circle -->
  <circle cx="260" cy="230" r="180" fill="#F0F9FF" opacity="0.6"/>
  <ellipse cx="260" cy="410" rx="170" ry="24" fill="#E2E8F0"/>

  <!-- Holographic Code Window (Left) -->
  <g transform="translate(40, 70)" filter="url(#devShadow)">
    <rect width="210" height="150" rx="14" fill="url(#codeDarkGrad)"/>
    <!-- Window top bar -->
    <rect width="210" height="26" rx="14" fill="#334155"/>
    <rect y="16" width="210" height="10" fill="#334155"/>
    <circle cx="16" cy="13" r="4" fill="#EF4444"/>
    <circle cx="28" cy="13" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="13" r="4" fill="#10B981"/>
    <text x="105" y="17" font-family="Tajawal, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">esaad-app.tsx</text>

    <!-- Code Syntax lines -->
    <text x="14" y="46" font-family="monospace" font-size="10" fill="#F43F5E">const</text>
    <text x="46" y="46" font-family="monospace" font-size="10" fill="#38BDF8">esaadProject</text>
    <text x="120" y="46" font-family="monospace" font-size="10" fill="#F8FAFC">=</text>
    <text x="130" y="46" font-family="monospace" font-size="10" fill="#FCD34D">{</text>
    
    <text x="24" y="64" font-family="monospace" font-size="9" fill="#94A3B8">speed:</text>
    <text x="64" y="64" font-family="monospace" font-size="9" fill="#34D399">"100ms"</text>
    <text x="105" y="64" font-family="monospace" font-size="9" fill="#F8FAFC">,</text>

    <text x="24" y="82" font-family="monospace" font-size="9" fill="#94A3B8">quality:</text>
    <text x="70" y="82" font-family="monospace" font-size="9" fill="#34D399">"Clean Code"</text>
    <text x="134" y="82" font-family="monospace" font-size="9" fill="#F8FAFC">,</text>

    <text x="24" y="100" font-family="monospace" font-size="9" fill="#94A3B8">deploy:</text>
    <text x="68" y="100" font-family="monospace" font-size="9" fill="#60A5FA">true</text>

    <text x="14" y="118" font-family="monospace" font-size="10" fill="#FCD34D">}</text>
    
    <!-- Status bar -->
    <rect y="128" width="210" height="22" rx="4" fill="#1E293B"/>
    <circle cx="16" cy="139" r="3" fill="#22C55E"/>
    <text x="25" y="142" font-family="Tajawal, sans-serif" font-size="9" font-weight="700" fill="#4ADE80">Build: SUCCESSFUL 🚀</text>
  </g>

  <!-- The Developer Specialist Mascot (Right) -->
  <!-- Legs -->
  <path d="M315 330 L305 415 L285 418 L285 425 L320 425 L328 340 Z" fill="#1E293B"/>
  <path d="M348 330 L358 415 L375 418 L375 425 L340 425 L334 340 Z" fill="#0F172A"/>

  <!-- Torso (Casual Tech Hoodie / Shirt with roll-up sleeves) -->
  <path d="M305 205 L370 205 L380 335 L295 335 Z" fill="#3B82F6"/>
  <!-- Dark inner shirt -->
  <path d="M320 205 L338 245 L355 205 Z" fill="#1E293B"/>
  <circle cx="338" cy="265" r="3" fill="#FFFFFF"/>
  <circle cx="338" cy="290" r="3" fill="#FFFFFF"/>

  <!-- Right Arm (Gesturing / interacting with code window) -->
  <path d="M305 210 L250 230 L235 200 L248 195 L260 215 L298 200 Z" fill="#2563EB"/>
  <path d="M235 200 L218 190 C214 187 218 180 224 182 L238 196 Z" fill="#FDE68A"/>

  <!-- Left Arm (Holding high-tech laptop) -->
  <path d="M370 210 L400 260 L380 290 L365 285 L382 258 L360 220 Z" fill="#2563EB"/>
  <!-- Laptop in hand -->
  <polygon points="360,295 405,285 425,320 380,330" fill="#0F172A"/>
  <polygon points="365,296 402,287 410,250 373,258" fill="#1E293B"/>
  <polygon points="368,294 400,286 407,255 375,262" fill="#38BDF8" opacity="0.8"/>

  <!-- Head -->
  <rect x="328" y="188" width="20" height="20" rx="4" fill="#FDE68A"/>
  <path d="M310 140 C310 105 365 105 365 140 C365 175 345 195 338 195 C330 195 310 175 310 140 Z" fill="#FEF08A"/>
  <!-- Hair -->
  <path d="M305 140 C302 105 325 85 355 85 C375 85 382 105 380 120 C372 116 365 115 360 118 C348 125 335 120 320 135 Z" fill="#0F172A"/>

  <!-- Glasses (Smart Developer Glasses) -->
  <rect x="325" y="138" width="14" height="10" rx="3" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="345" y="138" width="14" height="10" rx="3" fill="none" stroke="#1E293B" stroke-width="2"/>
  <line x1="339" y1="143" x2="345" y2="143" stroke="#1E293B" stroke-width="2"/>
  <circle cx="332" cy="143" r="2" fill="#0F172A"/>
  <circle cx="352" cy="143" r="2" fill="#0F172A"/>
  <path d="M332 158 Q338 164 345 158" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating Tech Badges (Stack) -->
  <g transform="translate(60, 240)" filter="url(#devShadow)">
    <rect width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="17" cy="17" r="10" fill="#EFF6FF"/>
    <text x="17" y="21" font-family="sans-serif" font-size="10" font-weight="900" fill="#2563EB" text-anchor="middle">⚛</text>
    <text x="32" y="21" font-family="Tajawal, sans-serif" font-size="11" font-weight="700" fill="#1E293B">React &amp; Next.js</text>
  </g>

  <g transform="translate(70, 290)" filter="url(#devShadow)">
    <rect width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="17" cy="17" r="10" fill="#ECFDF5"/>
    <text x="17" y="21" font-family="sans-serif" font-size="10" font-weight="900" fill="#059669" text-anchor="middle">📱</text>
    <text x="32" y="21" font-family="Tajawal, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Flutter &amp; Mobile</text>
  </g>

  <g transform="translate(380, 70)" filter="url(#devShadow)">
    <rect width="125" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="17" cy="17" r="10" fill="#FEF3C7"/>
    <text x="17" y="21" font-family="sans-serif" font-size="10" font-weight="900" fill="#D97706" text-anchor="middle">⚡</text>
    <text x="32" y="21" font-family="Tajawal, sans-serif" font-size="11" font-weight="700" fill="#1E293B">أنظمة وقواعد بيانات</text>
  </g>
</svg>
