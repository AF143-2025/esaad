<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" width="100%" height="100%">
  <defs>
    <linearGradient id="socRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="socBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="socInstaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833AB4"/>
      <stop offset="50%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#FCB045"/>
    </linearGradient>
    <linearGradient id="goldWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="socShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Warm Modern Arcs (Inspired by the original flyer's yellow & red circles) -->
  <circle cx="380" cy="180" r="160" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="430" cy="90" r="80" fill="#FEE2E2" opacity="0.7"/>
  <circle cx="450" cy="70" r="50" fill="#D42B2B" opacity="0.15"/>
  <circle cx="360" cy="200" r="110" fill="#FDE68A" opacity="0.3"/>

  <!-- Character / Mascot from the Flyer -->
  <!-- Shadow under character -->
  <ellipse cx="260" cy="450" rx="70" ry="14" fill="#E2E8F0"/>

  <!-- Legs -->
  <path d="M240 340 L225 435 L200 440 L200 448 L244 448 L256 350 Z" fill="#1E293B"/>
  <path d="M275 340 L290 435 L315 440 L315 448 L270 448 L262 350 Z" fill="#0F172A"/>

  <!-- Torso (Classic Grey Shirt with Black Collar like the flyer) -->
  <path d="M225 210 L295 210 L305 345 L215 345 Z" fill="#64748B"/>
  <!-- Dark Collar -->
  <path d="M242 210 L260 245 L278 210 Z" fill="#1E293B"/>
  <!-- Buttons -->
  <circle cx="260" cy="260" r="3" fill="#E2E8F0"/>
  <circle cx="260" cy="285" r="3" fill="#E2E8F0"/>
  <circle cx="260" cy="310" r="3" fill="#E2E8F0"/>

  <!-- Left Arm (At Hip) -->
  <path d="M225 215 L200 270 L212 295 L224 290 L214 270 L235 225 Z" fill="#475569"/>
  <!-- Left Hand resting on hip -->
  <ellipse cx="218" cy="295" rx="8" ry="6" fill="#FDE68A"/>

  <!-- Right Arm (Pointing Straight Up to the Social Clouds) -->
  <path d="M295 215 L335 205 L348 220 L305 235 Z" fill="#475569"/>
  <path d="M335 205 L370 115 L386 122 L348 220 Z" fill="#64748B"/>
  <!-- Pointing Finger Hand -->
  <path d="M370 115 L372 75 C372 70 380 70 380 75 L380 108 L386 112 C390 112 392 116 388 120 L378 125 Z" fill="#FDE68A"/>

  <!-- Neck & Head -->
  <rect x="250" y="192" width="20" height="20" rx="4" fill="#FDE68A"/>
  <path d="M230 145 C230 105 290 105 290 145 C290 180 270 195 260 195 C250 195 230 180 230 145 Z" fill="#FEF08A"/>
  <!-- Iconic Clean Jet-Black Hair from Flyer -->
  <path d="M225 145 C222 105 245 80 280 78 C305 78 312 100 310 120 C302 116 295 114 288 118 C275 125 260 120 245 138 C238 147 228 152 225 145 Z" fill="#0F172A"/>

  <!-- Eye & Smile -->
  <circle cx="278" cy="144" r="3.5" fill="#0F172A"/>
  <path d="M272 160 Q280 166 288 160" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="282" cy="150" r="4" fill="#F87171" opacity="0.4"/>

  <!-- Speech Bubbles & Social Icons Cloud (Exactly like the flyer pointing effect) -->
  <!-- Cloud Connection Trail Dots -->
  <circle cx="376" cy="65" r="4" fill="#F59E0B"/>
  <circle cx="382" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="392" cy="40" r="7" fill="#F59E0B"/>

  <!-- Floating Social Bubble 1: Instagram -->
  <g transform="translate(360, -10)" filter="url(#socShadow)">
    <circle cx="32" cy="32" r="28" fill="url(#socInstaGrad)"/>
    <rect x="20" y="20" width="24" height="24" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="38" cy="26" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Bubble 2: Facebook -->
  <g transform="translate(435, 30)" filter="url(#socShadow)">
    <circle cx="28" cy="28" r="25" fill="#1877F2"/>
    <path d="M32 23 H29 V20 C29 19.3 29.7 18.7 30.5 18.7 H32 V14.5 H29 C26.2 14.5 24.8 16.5 24.8 19.5 V23 H22 V27.5 H24.8 V39 H29 V27.5 H32 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Bubble 3: TikTok -->
  <g transform="translate(440, 110)" filter="url(#socShadow)">
    <circle cx="26" cy="26" r="24" fill="#000000"/>
    <path d="M29 15 C30.5 17 32.5 18 35 18.2 V21.5 C33 21.5 31.2 20.8 29.8 19.8 V27 C29.8 31 26.5 34 22.5 34 C18.5 34 15.5 31 15.5 27 C15.5 23 18.8 20 22.8 20.2 V23.5 C20.8 23.5 19 25 19 27 C19 29 20.5 30.5 22.5 30.5 C24.5 30.5 26.2 29 26.2 27 V15 Z" fill="#25F4EE"/>
    <path d="M28 16 C29.5 18 31.5 19 34 19.2 V20.5 C32 20.5 30.2 19.8 28.8 18.8 V26 C28.8 30 25.5 33 21.5 33 C18.5 33 16.5 30.5 16.5 27 C16.5 23.5 19.2 21 22.2 21.2 V22.5 C20.2 22.5 18.8 24 18.8 26 C18.8 28 20.2 29.5 22.2 29.5 C24.2 29.5 25.5 28 25.5 26 V16 Z" fill="#FE2C55"/>
  </g>

  <!-- Floating Social Bubble 4: WhatsApp -->
  <g transform="translate(300, 5)" filter="url(#socShadow)">
    <circle cx="26" cy="26" r="23" fill="#25D366"/>
    <path d="M33 29 C32.5 30.5 30.5 31.5 29 31.5 C26 31.5 21.5 28.5 19 25 C17.5 22.8 17.5 20.8 18.5 19.5 C19 18.8 19.8 18.8 20.2 18.8 H21.5 C22 18.8 22.2 19.2 22.5 19.8 L23.5 22.2 C23.8 22.8 23.5 23.2 23.2 23.5 L22.5 24.2 C23 25.5 24.5 27 26 27.5 L26.8 26.8 C27.2 26.5 27.5 26.5 28 26.8 L30.5 28 C31 28.2 31.2 28.5 31.2 29 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Bubble 5: Telegram -->
  <g transform="translate(260, 45)" filter="url(#socShadow)">
    <circle cx="24" cy="24" r="21" fill="#229ED9"/>
    <path d="M15 23 L31 16 L27 30 L22 26 L19 28 L19.5 24.5 L27 18 L18 23.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Social Bubble 6: Like Heart / Thumbs Up -->
  <g transform="translate(470, 75)" filter="url(#socShadow)">
    <circle cx="20" cy="20" r="18" fill="#EF4444"/>
    <path d="M20 26 L15 21 C13 19 13 16 15 14 C17 12 20 14 20 14 C20 14 23 12 25 14 C27 16 27 19 25 21 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Badge: "جميع مواقع التواصل الإجتماعي" (From the Flyer) -->
  <g transform="translate(30, 80)" filter="url(#socShadow)">
    <rect width="180" height="44" rx="22" fill="url(#socRedGrad)"/>
    <text x="90" y="28" font-family="Tajawal, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">جميع مواقع التواصل الإجتماعي</text>
  </g>

  <!-- Checklist Cards (From the Flyer) -->
  <!-- Checkmark 1: ترويج إعلانات -->
  <g transform="translate(20, 140)" filter="url(#socShadow)">
    <rect width="190" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="21" r="11" fill="#FEF2F2"/>
    <path d="M19 21 L23 25 L29 17" fill="none" stroke="#D42B2B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="26" font-family="Tajawal, sans-serif" font-size="13" font-weight="800" fill="#1E293B">ترويج إعلانات ممولة</text>
  </g>

  <!-- Checkmark 2: تصعيد حسابات -->
  <g transform="translate(20, 195)" filter="url(#socShadow)">
    <rect width="190" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="21" r="11" fill="#EFF6FF"/>
    <path d="M19 21 L23 25 L29 17" fill="none" stroke="#1A6FC4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="26" font-family="Tajawal, sans-serif" font-size="13" font-weight="800" fill="#1E293B">تصعيد وتنمية الحسابات</text>
  </g>

  <!-- Checkmark 3: فتح حسابات الإعلانية -->
  <g transform="translate(20, 250)" filter="url(#socShadow)">
    <rect width="190" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="21" r="11" fill="#FEF2F2"/>
    <path d="M19 21 L23 25 L29 17" fill="none" stroke="#D42B2B" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="26" font-family="Tajawal, sans-serif" font-size="13" font-weight="800" fill="#1E293B">فتح وإدارة الحسابات الإعلانية</text>
  </g>

  <!-- Checkmark 4: استرجاع وتوثيق الحسابات -->
  <g transform="translate(20, 305)" filter="url(#socShadow)">
    <rect width="190" height="42" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="24" cy="21" r="11" fill="#EFF6FF"/>
    <path d="M19 21 L23 25 L29 17" fill="none" stroke="#1A6FC4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="26" font-family="Tajawal, sans-serif" font-size="13" font-weight="800" fill="#1E293B">استرجاع وتوثيق الحسابات</text>
  </g>

  <!-- Floating Stats Card (Bottom Right) -->
  <g transform="translate(360, 320)" filter="url(#socShadow)">
    <rect width="160" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="26" font-family="Tajawal, sans-serif" font-size="11" font-weight="600" fill="#64748B">معدل التفاعل والنمو</text>
    <text x="20" y="50" font-family="Tajawal, sans-serif" font-size="20" font-weight="900" fill="#10B981">+285% 📈</text>
  </g>
</svg>
